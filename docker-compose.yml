services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: node-command-runner:latest
    init: true
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - COMMAND_TIMEOUT=15
      - NODE_ENV=production
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: unless-stopped
